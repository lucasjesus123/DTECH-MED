# =============================================================================
# Cabeçalhos de proxy — incluído pelo dtechmed.conf
# Copie para /etc/nginx/dtechmed-proxy.conf
# =============================================================================
proxy_http_version 1.1;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_set_header Host              $host;

# X-Forwarded-For só tem valor porque a aplicação roda com TRUST_PROXY=true e
# está atrás DESTE nginx. Se um dia a aplicação for exposta direto, o
# TRUST_PROXY precisa voltar a false — senão o IP da auditoria vira campo que
# qualquer um preenche, e um IP forjado na trilha é pior que nenhum IP.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_cache_bypass $http_upgrade;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
