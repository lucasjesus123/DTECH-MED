# =============================================================================
# DTECH MED — configuração do nginx do HOST
# =============================================================================
# NÃO É O QUE ESTÁ EM USO. A VPS de hoje não tem nginx: quem atende as portas
# 80 e 443 é o Caddy da gaveta PORTAL_ESTETICA, e o bloco de verdade está em
# `infra/caddy/dtechmed.caddy`. Instalar isto ali tomaria as portas do vizinho
# e derrubaria os três sites.
#
# Este arquivo fica no repositório para o dia em que o DTECH MED ganhar uma
# máquina só dele — aí ele é a configuração certa, e ainda traz o limite de
# taxa por IP na borda, que o Caddy sem plugin não tem.
# =============================================================================
# Copie para /etc/nginx/sites-available/dtechmed.conf e ative com:
#   ln -s /etc/nginx/sites-available/dtechmed.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Convivência com as outras gavetas da VPS: este arquivo responde SÓ pelos
# server_name abaixo. Nada de default_server — se ele fosse o padrão,
# capturaria requisições dos vizinhos.
# =============================================================================

# Limite de taxa na porta de entrada, antes de a aplicação gastar CPU.
# A aplicação também limita, mas ali o custo já foi pago.
limit_req_zone $binary_remote_addr zone=dtm_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=dtm_geral:10m rate=120r/m;

upstream dtechmed_app {
    server 127.0.0.1:5400;
    keepalive 32;
}

# ---- Redireciona http para https -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dtechmed.com.br www.dtechmed.com.br;

    # Deixa passar só o desafio do certbot.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dtechmed.com.br www.dtechmed.com.br;

    # ---- TLS (preenchido pelo certbot) --------------------------------------
    ssl_certificate     /etc/letsencrypt/live/dtechmed.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dtechmed.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:dtm_ssl:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Métodos aceitos ----------------------------------------------------
    # SEC-009 da auditoria: método incomum barrado aqui, antes de virar erro
    # 500 na aplicação e ruído no log.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # ---- Tamanho de upload --------------------------------------------------
    # Seis fotos de celular numa tacada. O limite da aplicação é 8 MB por foto.
    client_max_body_size 60m;
    client_body_timeout 120s;

    # ---- Cabeçalhos ---------------------------------------------------------
    # A Content-Security-Policy NÃO vem daqui: ela é gerada por requisição pelo
    # middleware da aplicação, com um nonce diferente a cada carregamento.
    # Duplicá-la aqui criaria duas políticas, e o navegador aplica a mais
    # restritiva das duas — quebrando a página de um jeito difícil de rastrear.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # ---- Logs ---------------------------------------------------------------
    access_log /var/log/nginx/dtechmed.access.log;
    error_log  /var/log/nginx/dtechmed.error.log warn;

    # ---- Login: limite de taxa mais apertado --------------------------------
    location = /entrar {
        limit_req zone=dtm_login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://dtechmed_app;
        include /etc/nginx/dtechmed-proxy.conf;
    }

    # ---- Arquivos estáticos do Next: cache longo ----------------------------
    location /_next/static/ {
        proxy_pass http://dtechmed_app;
        include /etc/nginx/dtechmed-proxy.conf;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Resto da aplicação -------------------------------------------------
    location / {
        limit_req zone=dtm_geral burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://dtechmed_app;
        include /etc/nginx/dtechmed-proxy.conf;
    }
}
