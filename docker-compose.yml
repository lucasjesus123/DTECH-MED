# =============================================================================
# DTECH MED — "gaveta" isolada para VPS compartilhada
# =============================================================================
# Princípios de convivência com outros sistemas no mesmo servidor:
#
#  1. NADA é publicado em 0.0.0.0. Todas as portas ficam presas em 127.0.0.1.
#     Só o nginx do host alcança a aplicação. Postgres nunca vê a internet.
#  2. Rede Docker própria e nomeada — sem tráfego cruzado com as outras gavetas.
#  3. Volumes com prefixo `dtechmed_` — impossível colidir com vizinhos.
#  4. Teto de CPU e memória em todos os serviços — a gaveta não sufoca o host.
#  5. Portas na faixa 54xx, reservada para este projeto.
#
# Suba sempre com o nome de projeto fixo:
#   docker compose -p dtechmed up -d
# =============================================================================

name: dtechmed

services:
  db:
    image: postgres:16-alpine
    container_name: dtechmed_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dtechmed}
      POSTGRES_USER: ${POSTGRES_USER:-dtechmed_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Locale pt-BR para ordenação correta de nomes com acento.
      LANG: pt_BR.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Apenas loopback do host. Jamais 0.0.0.0.
      - "127.0.0.1:5433:5432"
    volumes:
      - dtechmed_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      # Tuning para VPS compartilhada: conservador de propósito.
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtechmed_owner} -d ${POSTGRES_DB:-dtechmed}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
    networks:
      - dtechmed_net
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: dtechmed_app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # Dentro da rede Docker o host do banco é o nome do serviço.
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
    ports:
      # nginx do host faz proxy para cá. Não exposto à internet.
      - "127.0.0.1:5400:3000"
    volumes:
      # Fotos, PDFs e assinaturas. Persistem fora do container.
      - dtechmed_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    networks:
      - dtechmed_net
    logging: *log

  worker:
    # Processa a fila de automação (WhatsApp, PDF, notificações).
    # Processo separado de propósito: job pesado nunca trava a web.
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: dtechmed_worker
    restart: unless-stopped
    command: ["node", "worker/dist/index.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      WORKER_ENABLED: "true"
    volumes:
      - dtechmed_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks:
      - dtechmed_net
    logging: *log

  backup:
    # Dump diário do banco + retenção. Auto Backup da VPS é a segunda camada.
    image: postgres:16-alpine
    container_name: dtechmed_backup
    restart: unless-stopped
    env_file: .env
    volumes:
      - dtechmed_backups:/backups
      - ./infra/backup/run-backup.sh:/usr/local/bin/run-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/run-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - dtechmed_net
    logging: *log

networks:
  dtechmed_net:
    name: dtechmed_net
    driver: bridge

volumes:
  dtechmed_pgdata:
    name: dtechmed_pgdata
  dtechmed_storage:
    name: dtechmed_storage
  dtechmed_backups:
    name: dtechmed_backups
