# =============================================================================
# DTECH MED — "gaveta" isolada para VPS compartilhada
# =============================================================================
# Princípios de convivência com outros sistemas no mesmo servidor:
#
#  1. NADA é publicado em 0.0.0.0. Todas as portas ficam presas em 127.0.0.1.
#     Só o proxy de borda do host alcança a aplicação. Postgres nunca vê a
#     internet.
#  2. Rede Docker própria e nomeada — sem tráfego cruzado com as outras gavetas.
#  3. Volumes com prefixo `dtechmed_` — impossível colidir com vizinhos.
#  4. Teto de CPU e memória em todos os serviços — a gaveta não sufoca o host.
#  5. Portas na faixa 54xx, reservada para este projeto.
#
# Os tetos abaixo somam 3 vCPU e 3 GB numa VPS de 4 vCPU e 7,8 GB que já
# hospeda outras duas gavetas. São tetos, não reservas: o uso real fica bem
# abaixo. O que importa é que, se algo aqui disparar, o estrago para nos
# nossos 3 GB em vez de derrubar os vizinhos junto.
#
# Suba sempre com o nome de projeto fixo:
#   docker compose -p dtechmed up -d
# =============================================================================

name: dtechmed

services:
  db:
    image: postgres:16-alpine
    container_name: dtechmed_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dtechmed}
      POSTGRES_USER: ${POSTGRES_USER:-dtechmed_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Lida pelo script de init, que cria o papel de runtime `dtechmed_app`.
      #
      # Passada uma a uma, e não com `env_file: .env`, de propósito: o arquivo
      # inteiro traria para dentro do contêiner do banco o SESSION_SECRET, a
      # ENCRYPTION_KEY e o token do WhatsApp — segredos que o Postgres não tem
      # nenhum motivo para conhecer. Variável de ambiente é legível por
      # qualquer um que consiga executar algo dentro do contêiner, então cada
      # uma que entra aqui precisa se justificar.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
      # Locale pt-BR para ordenação correta de nomes com acento.
      LANG: pt_BR.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Apenas loopback do host. Jamais 0.0.0.0.
      - "127.0.0.1:5433:5432"
    volumes:
      - dtechmed_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      # Tuning para VPS compartilhada: conservador de propósito.
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500
      - -c
      - timezone=America/Sao_Paulo
    healthcheck:
      # O `-h 127.0.0.1` não é enfeite. Durante a inicialização, o entrypoint do
      # Postgres sobe um servidor temporário que escuta SÓ no soquete Unix, para
      # rodar os scripts de init sem ninguém conseguir conectar de fora. Sem o
      # -h, o pg_isready fala com esse servidor temporário e declara o banco
      # saudável no meio da inicialização — foi o que produziu um "Healthy"
      # seguido de "unhealthy" na mesma subida. Com o -h, só passa quando o
      # servidor definitivo estiver ouvindo em TCP, que é depois de o init ter
      # terminado inteiro.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-dtechmed_owner} -d ${POSTGRES_DB:-dtechmed}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    networks:
      - dtechmed_net
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: dtechmed_app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      # Dentro da rede Docker o host do banco é o nome do serviço.
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
    ports:
      # O proxy de borda faz o caminho até aqui. Nunca exposto à internet.
      #
      # Duas amarrações, e as duas são endereços locais da máquina:
      #   127.0.0.1  — para você conferir por dentro (curl, túnel de SSH).
      #   172.17.0.1 — o IP do host na ponte do Docker. É por onde o Caddy,
      #                que roda em contêiner, alcança a gaveta: para ele,
      #                127.0.0.1 seria ele mesmo. A gaveta vizinha do site da
      #                MINHAMECANICA usa exatamente este par.
      #
      # O segundo endereço deixa a porta 5400 visível para os contêineres da
      # máquina — não para a internet. É a aplicação web atrás de login, não o
      # banco: o Postgres, abaixo, continua só no 127.0.0.1.
      - "127.0.0.1:5400:3000"
      - "172.17.0.1:5400:3000"
    volumes:
      # Fotos, PDFs e assinaturas. Persistem fora do container.
      - dtechmed_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    networks:
      - dtechmed_net
    logging: *log

  worker:
    # Processa a fila de automação (WhatsApp, PDF, notificações).
    # Processo separado de propósito: job pesado nunca trava a web.
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: dtechmed_worker
    restart: unless-stopped
    command: ["node", "worker/dist/index.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      WORKER_ENABLED: "true"
    volumes:
      - dtechmed_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - dtechmed_net
    logging: *log

  migrador:
    # Serviço de uso PONTUAL: migrações e semeadura. Não sobe junto com o
    # resto — só com `--profile manutencao`.
    #
    # Usa o estágio de BUILD, e não o de runtime, porque precisa do CLI do
    # Prisma, do `tsx` e do `prisma.config.ts` — coisas que a imagem final
    # não carrega de propósito. Tentar migrar pela imagem enxuta falharia
    # justamente no dia do deploy.
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: dtechmed_migrador
    profiles: ["manutencao"]
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dtechmed_net
    logging: *log

  backup:
    # Dump diário do banco + retenção. Auto Backup da VPS é a segunda camada.
    image: postgres:16-alpine
    container_name: dtechmed_backup
    restart: unless-stopped
    env_file: .env
    volumes:
      - dtechmed_backups:/backups
      - ./infra/backup/run-backup.sh:/usr/local/bin/run-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/run-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - dtechmed_net
    logging: *log

networks:
  dtechmed_net:
    name: dtechmed_net
    driver: bridge

volumes:
  dtechmed_pgdata:
    name: dtechmed_pgdata
  dtechmed_storage:
    name: dtechmed_storage
  dtechmed_backups:
    name: dtechmed_backups
